# Explicit local-only opt-in for generated OpenAPI and Swagger UI.
# Never activate in a production, shared, or publicly bound deployment.
server:
  address: 127.0.0.1
springdoc:
  api-docs:
    enabled: true
    version: OPENAPI_3_1
  swagger-ui:
    enabled: true
    try-it-out-enabled: false
    supported-submit-methods: []
  packages-to-scan:
    - dev.asambataiden.iam.accessrequest
    - dev.asambataiden.iam.provisioning.quarantine
  paths-to-match:
    - /api/v1/access-requests
    - /api/v1/access-requests/**
    - /api/v1/provisioning/quarantine
    - /api/v1/provisioning/quarantine/**
