spring:
  application:
    name: enterprise-identity-access-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/iamdb}
    username: ${DB_USERNAME:iam_app}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IAM_JWT_ISSUER_URI:http://127.0.0.1:8281/realms/iam-lab}
          jwk-set-uri: ${IAM_JWT_JWKS_URI:http://127.0.0.1:8281/realms/iam-lab/protocol/openid-connect/certs}
          audiences:
            - ${IAM_JWT_AUDIENCE:iam-governance-api}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  address: 127.0.0.1
