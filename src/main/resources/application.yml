spring:
  application:
    name: enterprise-identity-access-platform
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  address: 127.0.0.1

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/iamdb}
    username: ${DB_USERNAME:iam_app}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
