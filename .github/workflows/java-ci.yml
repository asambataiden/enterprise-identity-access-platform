name: Java CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Validate local Keycloak lab assets
        run: |
          python3 -m json.tool ops/keycloak/realm/iam-lab-realm.json >/dev/null
          bash -n ops/keycloak/check-metadata.sh
      - name: Verify Java baseline
        run: mvn -B --no-transfer-progress clean verify
