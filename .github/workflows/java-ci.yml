name: Java CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Validate local Keycloak lab assets
        run: |
          python3 -m json.tool ops/keycloak/realm/iam-lab-realm.json >/dev/null
          bash -n ops/keycloak/check-metadata.sh
          python3 ops/keycloak/check-pkce-fixture.py
          python3 -m py_compile ops/keycloak/oidc-pkce-smoke.py ops/keycloak/provision-synthetic-user.py ops/keycloak/seed-authorized-iam-fixture.py ops/keycloak/ensure-subject-mapper.py ops/keycloak/ensure-decision-scope.py ops/keycloak/provision-synthetic-approver.py ops/keycloak/seed-approval-requests.py
          python3 -m unittest discover -s ops/keycloak -p 'test_*.py'
          docker compose -f ops/keycloak/compose.yaml config --quiet --no-interpolate
      - name: Verify Java baseline
        run: mvn -B --no-transfer-progress clean verify
