name: Java CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Validate immutable GitHub Actions supply-chain pins
        run: |
          python3 -m unittest discover -s ops/security -p 'test_*.py'
          python3 ops/security/verify_github_actions_pins.py
      - name: Validate local Keycloak lab assets
        run: |
          python3 -m json.tool ops/keycloak/realm/iam-lab-realm.json >/dev/null
          bash -n ops/keycloak/check-metadata.sh
          python3 ops/keycloak/check-pkce-fixture.py
          python3 -m py_compile ops/keycloak/verify-runtime.py ops/keycloak/oidc-pkce-smoke.py ops/keycloak/provision-synthetic-user.py ops/keycloak/seed-authorized-iam-fixture.py ops/keycloak/ensure-subject-mapper.py ops/keycloak/ensure-decision-scope.py ops/keycloak/provision-synthetic-approver.py ops/keycloak/seed-approval-requests.py
          python3 -m unittest discover -s ops/keycloak -p 'test_*.py'
          docker compose -f ops/keycloak/compose.yaml config --quiet --no-interpolate
      - name: Verify Java baseline
        run: mvn -B --no-transfer-progress clean verify
      - name: Create reproducible Java test evidence
        run: |
          python3 ops/security/create_ci_evidence.py \
            --kind java --out target/security-evidence/java-evidence.json
      - name: Publish curated Java evidence (14 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/security-evidence/java-evidence.json
          if-no-files-found: error
          retention-days: 14
