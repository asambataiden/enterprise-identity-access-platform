name: Security CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  dependency-vulnerabilities:
    name: Dependency vulnerabilities (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build dependency-bearing Spring Boot JAR (without rerunning tests)
        run: mvn -B --no-transfer-progress -DskipTests package
      - name: Reject high and critical dependency vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          format: table
          exit-code: '1'
          cache: 'true'

  java-sast:
    name: Java static analysis (SpotBugs + Find Security Bugs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify SpotBugs coverage parser
        run: python3 -m unittest discover -s ops/security -p 'test_*.py'
      - name: Compile and enforce SAST
        shell: bash
        run: |
          set -o pipefail
          mvn -B --no-transfer-progress -DskipTests package spotbugs:check 2>&1 | tee "$RUNNER_TEMP/spotbugs.log"
      - name: Reject newly missing SpotBugs analysis references
        run: |
          python3 ops/security/verify_spotbugs_coverage.py \
            --log "$RUNNER_TEMP/spotbugs.log" \
            --xml target/spotbugs.xml \
            --baseline config/spotbugs-missing-baseline.json
