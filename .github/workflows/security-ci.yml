name: Security CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  dependency-vulnerabilities:
    name: Dependency vulnerabilities (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build dependency-bearing Spring Boot JAR (without rerunning tests)
        run: mvn -B --no-transfer-progress -DskipTests package
      - name: Reject high and critical dependency vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          format: table
          exit-code: '1'
          cache: 'true'

  java-sast:
    name: Java static analysis (SpotBugs + Find Security Bugs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify immutable GitHub Actions supply-chain pins
        run: python3 ops/security/verify_github_actions_pins.py
      - name: Verify SpotBugs coverage parser
        run: python3 -m unittest discover -s ops/security -p 'test_*.py'
      - name: Compile and enforce SAST
        shell: bash
        run: |
          set -o pipefail
          mvn -B --no-transfer-progress -DskipTests package spotbugs:check 2>&1 | tee "$RUNNER_TEMP/spotbugs.log"
      - name: Reject newly missing SpotBugs analysis references
        shell: bash
        run: |
          set -o pipefail
          python3 ops/security/verify_spotbugs_coverage.py \
            --log "$RUNNER_TEMP/spotbugs.log" \
            --xml target/spotbugs.xml \
            --classes target/classes \
            --baseline config/spotbugs-missing-baseline.json | tee target/spotbugs-coverage.json
      - name: Create reproducible SAST evidence
        run: |
          python3 ops/security/create_ci_evidence.py \
            --kind sast --out target/security-evidence/sast-evidence.json
      - name: Publish curated SAST evidence (14 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sast-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/security-evidence/sast-evidence.json
          if-no-files-found: error
          retention-days: 14
